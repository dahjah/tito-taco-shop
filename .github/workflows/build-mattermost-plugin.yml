name: Build Mattermost Plugin

on:
  push:
    branches:
      - master
      - mattermost-and-bugfixes
    paths:
      - 'mattermost-plugin/**'
  pull_request:
    branches:
      - master
    paths:
      - 'mattermost-plugin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: mattermost-plugin
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Build Plugin
        run: make build
        
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tito-taco-shop-mattermost-plugin
          path: mattermost-plugin/dist/*.tar.gz
          retention-days: 14
